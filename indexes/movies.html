---
layout: default
title: Movies, Theaters and Series
permalink: /movies
---



<h1>Movies, Theaters and Series</h1>
<ul>
  {% assign sorted_projects = site.movies | sort: "date" | reverse %}
  {% for project in sorted_projects %}
    <li>
      <h2><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h2>
      <p>{{ project.excerpt }}</p>
    </li>
  {% endfor %}
</ul>
